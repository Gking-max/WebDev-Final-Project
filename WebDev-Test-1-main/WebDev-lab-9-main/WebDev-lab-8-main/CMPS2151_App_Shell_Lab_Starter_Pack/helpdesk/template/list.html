{{define "content"}}
<section class="page">
  <header class="page-header">
    <div>
      <h1>All tickets</h1>
      <p class="page-subtitle">{{len .Tickets}} saved tickets</p>
    </div>
    <a class="btn btn-primary" href="/tickets/create">New ticket</a>
  </header>

  {{if .Tickets}}
  <ul class="ticket-list" role="list">
    {{range .Tickets}}
    <li>
      <a class="ticket-row" href="/tickets/{{.ID}}">
        <span class="lead" aria-hidden="true">#{{.ID}}</span>
        <div class="row-text">
          <span class="ticket-title">{{.Title}}</span>
          <span class="ticket-meta">{{.LocationName}} · {{.CategoryName}}</span>
        </div>
        <div class="row-trail">
          <span class="pill pill-{{statusMod .StatusName}}">{{.StatusName}}</span>
          <span class="chevron" aria-hidden="true"></span>
        </div>
      </a>
    </li>
    {{end}}
  </ul>
  {{else}}
  <p class="empty-state">No tickets yet. <a href="/tickets/create">Create the first ticket</a>.</p>
  {{end}}
</section>
{{end}}
